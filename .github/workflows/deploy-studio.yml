name: Deploy Weapon Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate data (gate)
        run: node tools/validate_studio_data.mjs

      # The page shows the bundled datasets. Rebuild them from this commit's Mod Source, with Curation,
      # so the site always matches the repo even if a commit forgot to regenerate them.
      - name: Build weapon data
        run: node tools/export_snapshots.js

      - name: Stamp build
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%m.%d.%Y')
          printf 'window.STUDIO_BUILD = { hosted: true, commit: "%s", date: "%s" };\n' \
            "$GITHUB_SHA" "$COMMIT_DATE" > studio/data/build_info.js

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r studio/. _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - uses: actions/deploy-pages@v5
